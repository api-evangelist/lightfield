merge_semantics:
  note: >-
    Duplicate records can be merged. The docs API reference exposes merge.mergeAccounts,
    merge.mergeContacts, merge.mergeOpportunities, merge.mergeObjectValues and merge.getMerge (added
    in the 2026-06-19 changelog); these are surfaced in the SDKs and CLI but are not present in the
    OpenAPI description captured on 2026-07-19.
spec_vs_docs_divergence:
  note: >-
    The Stainless-published OpenAPI description captured on 2026-07-19 is a subset of the docs API
    reference. The docs list Delete methods for account, contact, opportunity, task, meeting, note,
    list and object, and a full merge resource; none of these appear in the captured spec, which
    contains no DELETE operations at all. Entity operation lists in this file follow the spec; the
    docs-only methods are called out per entity.
