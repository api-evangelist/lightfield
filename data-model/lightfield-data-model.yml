docs: https://docs.lightfield.app/objects-in-lightfield/object-types/
model: >-
  Lightfield uses a uniform, definition-driven object model rather than fixed per-entity schemas.
  Every record — built-in or custom — is returned with the same envelope: an `id`, `createdAt`, a
  `fields` map of {value, valueType}, a `relationships` map of {cardinality, objectType, values},
  and an `httpLink` back into the CRM UI. System field and relationship keys are prefixed with `$`
  (e.g. `$name`, `$website`, `$transcript`, `$owner`). Because relationships are data rather than
  schema, the concrete relationship graph for a workspace is discovered at runtime via each object's
  Definitions method — this artifact records the built-in entities and the relationship edges
  Lightfield documents, not an exhaustive fixed schema.
envelope:
  record_fields: [id, createdAt, fields, relationships, httpLink]
  field_shape: {value: any, valueType: string}
  relationship_shape: {cardinality: string, objectType: string, values: [id]}
  system_key_prefix: '$'
  list_envelope: {data: [record], object: string, totalCount: integer}
discovery:
  definitions_operations:
  - account.definitions
  - contact.definitions
  - opportunity.definitions
  - task.definitions
  - meeting.definitions
  - note.definitions
  - object.definitions
  - object.listDefinitions
  note: >-
    Definitions return the field and relationship definitions for an object type, including
    valueType and relationship cardinality. This is the authoritative source for a given workspace.
field_value_types:
- NUMBER
- CURRENCY
- DATETIME
- TEXT
- FULL_NAME
- SOCIAL_HANDLE
- ADDRESS
- CHECKBOX
- SINGLE_SELECT
- MULTI_SELECT
- EMAIL
- TELEPHONE
- URL
- MARKDOWN
