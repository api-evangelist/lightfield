aid: lightfield
name: Lightfield
description: 'Lightfield is an agent-native customer relationship management (CRM) platform for
  high-growth and AI-native go-to-market teams. Rather than depending on manual data entry, Lightfield
  captures customer interactions — calls, emails, meetings and external signals — as unstructured
  data, organizes them into a versioned context graph of CRM objects, and lets AI agents reason over
  that graph to generate pipeline, prepare for meetings, enrich records and drive follow-up. The
  public Lightfield API (beta) provides read/write access to every CRM entity — accounts, contacts,
  opportunities, meetings, notes, tasks, lists, emails, files, members, custom objects and workflow
  runs — across 55 operations, with first-party TypeScript, Python and Go SDKs, a Go CLI, and a
  hosted Model Context Protocol server at mcp.lightfield.app secured with OAuth 2.1. Workflows and
  Automations add trigger-driven agent pipelines fed by inbound webhooks, object lifecycle events and
  schedules. Backed by Greylock and Lightspeed Venture Partners.'
