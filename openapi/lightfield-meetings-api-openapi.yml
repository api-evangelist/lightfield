      properties:
        object:
          type: string
          description: The object type, always `"list"`.
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for the entity.
              createdAt:
                type: string
                description: ISO 8601 timestamp of when the entity was created.
              updatedAt:
                anyOf:
                - type: string
                - type: 'null'
                description: ISO 8601 timestamp of when the entity was last updated, or null.
              httpLink:
                anyOf:
                - type: string
                - type: 'null'
                description: URL to view the entity in the Lightfield web app, or null.
              externalId:
                anyOf:
                - type: string
                - type: 'null'
                description: External identifier for the entity, or null if unset.
              fields:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  type: object
                  properties:
                    valueType:
                      enum:
                      - ADDRESS
                      - CHECKBOX
                      - CURRENCY
                      - DATETIME
                      - EMAIL
                      - FULL_NAME
                      - MARKDOWN
                      - MULTI_SELECT
                      - NUMBER
                      - SINGLE_SELECT
                      - SOCIAL_HANDLE
                      - TELEPHONE
                      - TEXT
                      - URL
                      - HTML
                      description: The data type of the field.
                    value:
                      anyOf:
                      - type: string
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: number
                      - type: boolean
                      - type: 'null'
                      - type: array
                        items:
                          type: string
                      - $ref: '#/components/schemas/Address'
                      - $ref: '#/components/schemas/FullName'
                      description: The field value, or null if unset.
                  required:
                  - valueType
                  - value
                description: Map of field names to their typed values. System fields are prefixed with `$` (e.g. `$name`, `$email`); custom attributes use their bare slug.
              relationships:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  type: object
                  properties:
                    cardinality:
                      type: string
                      description: Whether the relationship is `has_one` or `has_many`.
                    objectType:
                      type: string
                      description: The type of the related object (e.g. `account`, `contact`).
                    values:
                      type: array
                      items:
                        type: string
                      description: IDs of the related entities.
                  required:
                  - cardinality
                  - objectType
                  - values
                description: Map of relationship names to their associated entities. System relationships are prefixed with `$` (e.g. `$owner`, `$contact`).
              objectType:
                enum:
                - meeting
                description: Always `meeting`.
              accessLevel:
                enum:
                - FULL
                - METADATA
                description: The caller's resolved access level for this meeting.
            required:
            - id
            - createdAt
            - updatedAt
            - httpLink
            - fields
            - relationships
            - objectType
            - accessLevel
            additionalProperties: false
          description: Array of meeting objects for the current page.
        totalCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Total number of entities matching the query.
      required:
      - object
      - data
      - totalCount
    UnauthorizedError:
      type: object
      properties:
        type:
          const: unauthorized
        message:
          type: string
          default: Unauthorized
      required:
      - type
      - message
    BadRequestError:
      type: object
      properties:
        type:
          const: bad_request
        message:
          type: string
          default: Bad Request
        code:
          type: string
        param:
          type: string
      required:
      - type
      - message
      - code
    ServiceUnavailableError:
      type: object
      properties:
        type:
          const: service_unavailable
        message:
          type: string
          default: Service Unavailable
      required:
      - type
      - message
    NotFoundError:
      type: object
      properties:
        type:
          const: not_found
        message:
          type: string
          default: Not Found
      required:
      - type
      - message
    UnprocessableContentError:
      type: object
      properties:
        type:
          const: unprocessable_content
        message:
          type: string
          default: Unprocessable Content
      required:
      - type
      - message
    Address:
      type: object
      properties:
        street:
          anyOf:
          - type: string
          - type: 'null'
          description: Street address line 1.
        street2:
          anyOf:
          - type: string
          - type: 'null'
          description: Street address line 2.
        city:
          anyOf:
          - type: string
          - type: 'null'
          description: City name.
        state:
          anyOf:
          - type: string
          - type: 'null'
          description: State or province.
        postalCode:
          anyOf:
          - type: string
          - type: 'null'
          description: Postal or ZIP code.
        country:
          anyOf:
          - type: string
          - type: 'null'
          description: 2-letter ISO 3166-1 alpha-2 country code.
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          description: Latitude coordinate.
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          description: Longitude coordinate.
      additionalProperties: false
      title: Address
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
