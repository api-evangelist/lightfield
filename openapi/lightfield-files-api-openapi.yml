components:
  schemas:
    FileCompleteResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the file.
        status:
          enum:
          - PENDING
          - COMPLETED
          - CANCELLED
          - EXPIRED
          description: Current upload status of the file.
        filename:
          type: string
          description: Original filename.
        mimeType:
          type: string
          description: MIME type of the file.
        sizeBytes:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: File size in bytes.
        createdAt:
          type: string
          description: When the file upload session was created.
        completedAt:
          anyOf:
          - type: string
          - type: 'null'
          description: When the file upload was completed.
        expiresAt:
          anyOf:
          - type: string
          - type: 'null'
          description: When the upload session expires. Null once completed, cancelled, or expired.
      required:
      - id
      - status
      - filename
      - mimeType
      - sizeBytes
      - createdAt
      - completedAt
      - expiresAt
    FileRetrieveResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the file.
        status:
          enum:
          - PENDING
          - COMPLETED
          - CANCELLED
          - EXPIRED
          description: Current upload status of the file.
        filename:
          type: string
          description: Original filename.
        mimeType:
          type: string
          description: MIME type of the file.
        sizeBytes:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: File size in bytes.
        createdAt:
          type: string
          description: When the file upload session was created.
        completedAt:
          anyOf:
          - type: string
          - type: 'null'
          description: When the file upload was completed.
        expiresAt:
          anyOf:
          - type: string
          - type: 'null'
          description: When the upload session expires. Null once completed, cancelled, or expired.
      required:
      - id
      - status
      - filename
      - mimeType
      - sizeBytes
      - createdAt
      - completedAt
      - expiresAt
    InternalServerError:
      type: object
      properties:
        type:
          const: internal_server_error
        message:
          type: string
          default: Internal Server Error
      required:
      - type
      - message
    GatewayTimeoutError:
      type: object
      properties:
        type:
          const: gateway_timeout
        message:
          type: string
          default: Gateway Timeout
      required:
      - type
      - message
    TooManyRequestsError:
      type: object
      properties:
        type:
          const: too_many_requests
        message:
          type: string
          default: Too Many Requests
      required:
      - type
      - message
    UnsupportedMediaTypeError:
      type: object
      properties:
        type:
          const: unsupported_media_type
        message:
          type: string
          default: Unsupported Media Type
      required:
      - type
      - message
    ForbiddenError:
      type: object
      properties:
        type:
          const: forbidden
        message:
          type: string
          default: Forbidden
      required:
      - type
      - message
    UnauthorizedError:
      type: object
      properties:
        type:
          const: unauthorized
        message:
          type: string
          default: Unauthorized
      required:
      - type
      - message
    ConflictError:
      type: object
      properties:
        type:
          const: conflict
        message:
          type: string
          default: Conflict
      required:
      - type
      - message
    FileUrlResponse:
      type: object
      properties:
        url:
          type: string
          description: Temporary download URL for the file.
        expiresAt:
          type: string
          description: When the download URL expires.
      required:
      - url
      - expiresAt
    BadRequestError:
      type: object
      properties:
        type:
          const: bad_request
        message:
          type: string
          default: Bad Request
