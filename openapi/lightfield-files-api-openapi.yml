      required:
      - id
      - status
      - filename
      - mimeType
      - sizeBytes
      - createdAt
      - completedAt
      - expiresAt
    FileCreateResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the file.
        status:
          enum:
          - PENDING
          - COMPLETED
          - CANCELLED
          - EXPIRED
          description: Current upload status of the file.
        filename:
          type: string
          description: Original filename.
        mimeType:
          type: string
          description: MIME type of the file.
        sizeBytes:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: File size in bytes.
        createdAt:
          type: string
          description: When the file upload session was created.
        completedAt:
          anyOf:
          - type: string
          - type: 'null'
          description: When the file upload was completed.
        expiresAt:
          anyOf:
          - type: string
          - type: 'null'
          description: When the upload session expires. Null once completed, cancelled, or expired.
        uploadUrl:
          type: string
          description: Upload URL. Upload the file bytes directly to this URL.
        uploadHeaders:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Headers to include in the upload request.
      required:
      - id
      - status
      - filename
      - mimeType
      - sizeBytes
      - createdAt
      - completedAt
      - expiresAt
      - uploadUrl
      - uploadHeaders
    UnprocessableContentError:
      type: object
      properties:
        type:
          const: unprocessable_content
        message:
          type: string
          default: Unprocessable Content
      required:
      - type
      - message
    FileListResponse:
      type: object
      properties:
        object:
          type: string
          description: The object type, always `"list"`.
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for the file.
              status:
                enum:
                - PENDING
                - COMPLETED
                - CANCELLED
                - EXPIRED
                description: Current upload status of the file.
              filename:
                type: string
                description: Original filename.
              mimeType:
                type: string
                description: MIME type of the file.
              sizeBytes:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
                description: File size in bytes.
              createdAt:
                type: string
                description: When the file upload session was created.
              completedAt:
                anyOf:
                - type: string
                - type: 'null'
                description: When the file upload was completed.
              expiresAt:
                anyOf:
                - type: string
                - type: 'null'
                description: When the upload session expires. Null once completed, cancelled, or expired.
            required:
            - id
            - status
            - filename
            - mimeType
            - sizeBytes
            - createdAt
            - completedAt
            - expiresAt
          description: Array of file objects for the current page.
        totalCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Total number of matching files.
      required:
      - object
      - data
      - totalCount
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
