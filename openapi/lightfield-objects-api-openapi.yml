        '403':
          description: '403'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: '404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: '409'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '415':
          description: '415'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedMediaTypeError'
        '422':
          description: '422'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentError'
        '429':
          description: '429'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '500':
          description: '500'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: '503'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
        '504':
          description: '504'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutError'
      tags:
      - Objects
components:
  schemas:
    GatewayTimeoutError:
      type: object
      properties:
        type:
          const: gateway_timeout
        message:
          type: string
          default: Gateway Timeout
      required:
      - type
      - message
    TooManyRequestsError:
      type: object
      properties:
        type:
          const: too_many_requests
        message:
          type: string
          default: Too Many Requests
      required:
      - type
      - message
    ObjectListResponse:
      type: object
      properties:
        object:
          type: string
          description: The object type, always `"list"`.
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for the entity.
              createdAt:
                type: string
                description: ISO 8601 timestamp of when the entity was created.
              updatedAt:
                anyOf:
                - type: string
                - type: 'null'
                description: ISO 8601 timestamp of when the entity was last updated, or null.
              httpLink:
                anyOf:
                - type: string
                - type: 'null'
                description: URL to view the entity in the Lightfield web app, or null.
              externalId:
                anyOf:
                - type: string
                - type: 'null'
                description: External identifier for the entity, or null if unset.
              fields:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  type: object
                  properties:
                    valueType:
                      enum:
                      - ADDRESS
                      - CHECKBOX
                      - CURRENCY
                      - DATETIME
                      - EMAIL
                      - FULL_NAME
                      - MARKDOWN
                      - MULTI_SELECT
                      - NUMBER
                      - SINGLE_SELECT
                      - SOCIAL_HANDLE
                      - TELEPHONE
                      - TEXT
                      - URL
                      - HTML
                      description: The data type of the field.
                    value:
                      anyOf:
                      - type: string
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: number
                      - type: boolean
                      - type: 'null'
                      - type: array
                        items:
                          type: string
                      - $ref: '#/components/schemas/Address'
                      - $ref: '#/components/schemas/FullName'
                      description: The field value, or null if unset.
                  required:
                  - valueType
                  - value
                description: Map of field names to their typed values. System fields are prefixed with `$` (e.g. `$name`, `$email`); custom attributes use their bare slug.
              relationships:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  type: object
                  properties:
                    cardinality:
                      type: string
                      description: Whether the relationship is `has_one` or `has_many`.
                    objectType:
                      type: string
                      description: The type of the related object (e.g. `account`, `contact`).
                    values:
                      type: array
                      items:
                        type: string
                      description: IDs of the related entities.
                  required:
                  - cardinality
                  - objectType
                  - values
                description: Map of relationship names to their associated entities. System relationships are prefixed with `$` (e.g. `$owner`, `$contact`).
            required:
            - id
            - createdAt
            - updatedAt
            - httpLink
            - fields
            - relationships
            additionalProperties: false
          description: Array of entity objects for the current page.
        totalCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Total number of entities matching the query.
      required:
      - object
      - data
      - totalCount
    ConflictError:
      type: object
      properties:
        type:
          const: conflict
        message:
          type: string
          default: Conflict
      required:
      - type
      - message
    UnprocessableContentError:
      type: object
      properties:
        type:
          const: unprocessable_content
        message:
          type: string
          default: Unprocessable Content
      required:
      - type
      - message
    ObjectDefinitionsResponse:
      type: object
      properties:
        objectType:
          type: string
          description: The object type these definitions belong to (e.g. `account`).
        fieldDefinitions:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the field definition.
              label:
                type: string
                description: Human-readable display name of the field.
              description:
                anyOf:
                - type: string
                - type: 'null'
                description: Description of the field, or null.
              valueType:
                enum:
                - ADDRESS
                - CHECKBOX
                - CURRENCY
                - DATETIME
                - EMAIL
                - FULL_NAME
                - MARKDOWN
                - MULTI_SELECT
                - NUMBER
                - SINGLE_SELECT
                - SOCIAL_HANDLE
                - TELEPHONE
                - TEXT
                - URL
                - HTML
                description: Data type of the field.
              readOnly:
                type: boolean
                description: '`true` for fields that are not writable via the API (e.g. AI-generated summaries). `false` or absent for writable fields.'
              typeConfiguration:
                type: object
                properties:
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the select option.
                        label:
                          type: string
                          description: Human-readable display name of the option.
                        description:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: Description of the option, or null.
                      required:
                      - id
                      - label
                      additionalProperties: false
                    description: Available options for select fields.
                  currency:
                    type: string
                    description: ISO 4217 3-letter currency code.
                  unique:
                    type: boolean
                    description: Whether values for this field must be unique.
                  multipleValues:
                    type: boolean
                    description: Whether this field accepts multiple values.
                  handleService:
                    enum:
                    - TWITTER
                    - LINKEDIN
                    - FACEBOOK
                    - INSTAGRAM
                    description: Social platform associated with this handle field.
                additionalProperties: false
                description: Type-specific configuration (e.g. select options, currency code).
            required:
            - label
            - description
            - valueType
            - typeConfiguration
          description: Map of field keys to their definitions, including both system and custom fields.
        relationshipDefinitions:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the relationship definition.
              label:
                type: string
                description: Human-readable display name of the relationship.
              description:
                anyOf:
                - type: string
                - type: 'null'
                description: Description of the relationship, or null.
              cardinality:
                enum:
                - HAS_ONE
                - HAS_MANY
                description: Whether this is a `has_one` or `has_many` relationship.
              objectType:
                type: string
                description: The type of the related object (e.g. `account`, `contact`).
            required:
            - label
            - description
            - cardinality
            - objectType
          description: Map of relationship keys to their definitions.
      required:
      - objectType
      - fieldDefinitions
      - relationshipDefinitions
