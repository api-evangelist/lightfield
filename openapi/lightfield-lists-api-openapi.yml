components:
  schemas:
    ListListResponse:
      type: object
      properties:
        object:
          type: string
          description: The object type, always `"list"`.
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for the list.
              createdAt:
                type: string
                description: ISO 8601 timestamp of when the list was created.
              httpLink:
                anyOf:
                - type: string
                - type: 'null'
                description: URL to view the list in the Lightfield web app, or null.
              fields:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  type: object
                  properties:
                    valueType:
                      enum:
                      - ADDRESS
                      - CHECKBOX
                      - CURRENCY
                      - DATETIME
                      - EMAIL
                      - FULL_NAME
                      - MARKDOWN
                      - MULTI_SELECT
