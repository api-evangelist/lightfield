openapi: 3.1.1
info:
  title: API Reference Accounts Lists API
  version: 0.0.0
tags:
- name: Lists
paths:
  /v1/lists:
    post:
      operationId: list.create
      summary: Create a list
      description: 'Creates a new list. The `$name` and `$objectType` fields are required.


        Supports idempotency via the `Idempotency-Key` header.


        **[Required scope](/using-the-api/scopes/):** `lists:create`


        **[Rate limit category](/using-the-api/rate-limits/):** Write'
      security:
      - bearerAuth: []
      parameters:
      - name: Lightfield-Version
        in: header
        required: true
        description: Required API version header. Requests may error without it.
        schema:
          type: string
          enum:
          - '2026-03-01'
          default: '2026-03-01'
        example: '2026-03-01'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  properties:
                    $name:
                      type: string
                      description: Display name of the list.
                    $objectType:
                      type: string
                      description: The type of entities this list contains. Use `$account`, `$contact`, or `$opportunity` (the `$` prefix identifies system types). Bare slugs without the prefix (e.g. `account`) are accepted for backward compatibility but are deprecated.
                  required:
                  - $name
                  - $objectType
                  additionalProperties: false
                  description: 'Field values for the new list. Required: `$name` (string) and `$objectType`.'
                relationships:
                  anyOf:
                  - type: object
                    properties:
                      $accounts:
                        anyOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                        description: Account ID(s) to add as initial members. List `$objectType` must be `account`.
                    required:
                    - $accounts
                    additionalProperties: false
                  - type: object
                    properties:
                      $contacts:
                        anyOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                        description: Contact ID(s) to add as initial members. List `$objectType` must be `contact`.
                    required:
                    - $contacts
                    additionalProperties: false
                  - type: object
                    properties:
                      $opportunities:
                        anyOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                        description: Opportunity ID(s) to add as initial members. List `$objectType` must be `opportunity`.
                    required:
                    - $opportunities
                    additionalProperties: false
                  description: Relationships to set on the new list.
              required:
              - fields
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCreateResponse'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: '401'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: '403'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: '404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: '409'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '415':
          description: '415'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedMediaTypeError'
        '422':
          description: '422'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentError'
        '429':
