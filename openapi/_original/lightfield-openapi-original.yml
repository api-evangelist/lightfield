    "/v1/meetings": {
      "post": {
        "operationId": "meeting.create",
        "summary": "Create a meeting",
        "description": "Creates a new meeting record. This endpoint only supports creation of meetings in the past. The `$title`, `$startDate`, and `$endDate` fields are required. Only the `$transcript` relationship is writable on create; all other meeting relationships are system-managed. The `$account` and `$opportunity` relationships are read-only and are derived from the meeting's `$contact` attendees and the accounts/opportunities those contacts belong to. The response is privacy-aware and includes a read-only `accessLevel`. See <u>[Uploading meeting transcripts](/using-the-api/uploading-meeting-transcripts/)</u> for the full file upload and transcript attachment flow.\n\nSupports idempotency via the `Idempotency-Key` header.\n\n**[Required scope](/using-the-api/scopes/):** `meetings:create`\n\n**[Rate limit category](/using-the-api/rate-limits/):** Write",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "Lightfield-Version",
            "in": "header",
            "required": true,
            "description": "Required API version header. Requests may error without it.",
            "schema": {
              "type": "string",
              "enum": [
                "2026-03-01"
              ],
              "default": "2026-03-01"
            },
            "example": "2026-03-01"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "fields": {
                    "type": "object",
                    "properties": {
                      "$title": {
                        "type": "string",
                        "description": "The title of the meeting."
                      },
                      "$startDate": {
                        "type": "string",
                        "description": "The start time of the meeting in ISO 8601 format. Must be in the past."
                      },
                      "$endDate": {
                        "type": "string",
                        "description": "The end time of the meeting in ISO 8601 format. Must be in the past."
                      },
                      "$description": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "A description of the meeting."
                      },
                      "$meetingUrl": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "The URL for the meeting."
                      },
                      "$organizerEmail": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "The email address of the meeting organizer. This field accepts a single email address."
                      },
                      "$attendeeEmails": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        },
                        "description": "A list of attendee email addresses."
                      },
                      "$privacySetting": {
                        "anyOf": [
                          {
                            "enum": [
                              "FULL",
                              "METADATA"
                            ]
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "The privacy setting for the meeting (`FULL` or `METADATA`)."
                      }
                    },
                    "required": [
                      "$title",
                      "$startDate",
                      "$endDate"
                    ],
                    "additionalProperties": false,
                    "description": "Field values for the new MANUAL meeting. System fields use a `$` prefix (for example `$title`, `$startDate`, `$endDate`). Required: `$title`, `$startDate`, and `$endDate`. `$organizerEmail` accepts a single email address when provided; `$attendeeEmails` accepts an array of email addresses. See <u>[Fields and relationships](/using-the-api/fields-and-relationships/)</u> for value type details."
                  },
                  "relationships": {
                    "type": "object",
                    "properties": {
                      "$transcript": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "array",
                            "items": {
                              "type": "string"
                            }
                          }
                        ],
                        "description": "The ID of the file to attach as the meeting transcript when creating the meeting. Only one transcript can be attached to a meeting."
                      }
                    },
                    "required": [
                      "$transcript"
                    ],
                    "additionalProperties": false,
                    "description": "Relationships to set on the new meeting. Only `$transcript` is writable on create; all other meeting relationships are system-managed."
                  },
                  "autoCreateRecords": {
                    "type": "boolean",
                    "description": "When true, the initial post-create meeting sync may auto-create account and contact records for external attendees."
                  }
                },
                "required": [
                  "fields"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MeetingCreateResponse"
                }
              }
            }
          },
          "400": {
            "description": "400",
            "content": {
