notes: >-
  All Lightfield client libraries are Stainless-generated from the same OpenAPI description
  (openapi_spec_hash recorded in each repo's .stats.yml). Versions and publish dates below were read
  from each registry's metadata endpoint on 2026-08-13 — registry.npmjs.org, pypi.org/pypi/.../json,
  proxy.golang.org — not from the docs. The TypeScript and Python libraries remain pre-release
  (alpha) while the API is in public beta. Two currency findings this round: (1) the npm TypeScript
  library has not shipped since 2026-04-18 while the Python library reached 0.17.0a0 on 2026-08-06
  and the Go library v0.10.0 on 2026-07-28, so the same generated surface is now three-and-a-half
  months stale in TypeScript; (2) the Homebrew cask pins CLI 0.6.0 while the Go module has tagged
  v0.7.0, so `brew install` lags `go install` by one minor version.
