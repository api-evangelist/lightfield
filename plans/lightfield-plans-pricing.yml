summary: >-
  Lightfield prices on consumption credits, not seats. Every plan includes unlimited seats and all
  core features; the tiers differ only in the per-credit rate, the credit allotment, and the level
  of support. The one feature gate is role-based access control and single sign-on, which are
  Enterprise-only, and BAA availability, also Enterprise-only. Credits are annual and do not roll
  over; overage is billed at the plan rate rather than cutting off service. Lightfield publishes a
  sizing rule of thumb on the same page: roughly 8,300 credits per month per active seller, which
  it quotes as about $400/month per seller pay-as-you-go or about $240/month on an annual
  commitment. Only the Starter tier is self-serve ("Create account"); Pro, Growth and Enterprise
  all route to "Request demo".
