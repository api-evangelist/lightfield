notes: >-
  The Lightfield discovery surface lives on the MCP host. The RFC 9728 protected-resource and RFC
  8414 authorization-server documents are served from mcp.lightfield.app and point at a Stytch-backed
  authorization server. Neither the marketing host nor the REST API host publishes a /.well-known/
  surface; the REST API authenticates with scoped bearer API keys rather than OAuth, so the absence
  of OAuth metadata on api.lightfield.app is expected. No security.txt is published — the
  vulnerability disclosure policy is documented at https://docs.lightfield.app/security/ instead.
